name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        # libgphoto2 provides the headers + dylibs the Nikon (PTP) capture path
        # links against; without it the bridging header can't find gphoto2.h.
        run: brew install xcodegen libgphoto2

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Debug, unsigned)
        run: |
          xcodebuild \
            -project Photobooth.xcodeproj \
            -scheme Photobooth \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
